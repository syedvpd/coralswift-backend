[project]
name = "coralswift-backend"
version = "0.1.0"
description = "Coral Swift backend (FastAPI modular monolith)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]
"app/modules/auth/constants.py" = ["S105"]
"app/modules/auth/schemas.py" = ["S105"]
"app/modules/notifications/constants.py" = ["S105"]
"app/modules/reviews/router.py" = ["S101"]
"scripts/**" = ["E501"]
"app/modules/catalog/router.py" = ["E501"]  # static PRD-derived copy

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real PostgreSQL (TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
