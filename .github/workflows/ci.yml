name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Disposable database inside the runner. No repository secret is used, so CI can never
      # reach Supabase, Brevo, Turnstile or real storage (tests use fakes and mocks).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_test
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_test
      SECRET_KEY: ci-only-secret-key-not-for-deployment-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migrations apply to a fresh database and match the models
        run: |
          python scripts/alembic_test_db.py upgrade head
          python scripts/alembic_test_db.py heads
          python scripts/alembic_test_db.py check
      - name: Application builds
        run: python -c "from app.main import create_app; from app.core.config import load_settings; create_app(load_settings())"
      - name: Maintenance script help (no database access)
        run: python scripts/run_maintenance.py --help
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coralswift-api .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id coralswift-api -u)" != "0"
